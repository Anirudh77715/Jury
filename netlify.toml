# GreenScore is a single static page: no build step, publish this folder as-is.
[build]
  publish = "."

# index.html loads its libraries from ./lib/ first, then falls back to the CDN.
# These rewrites serve the same pinned CDN builds at /lib/*, so the first
# request succeeds and the console stays free of 404s. If you add the real
# files to lib/, Netlify serves those instead (force = false).
[[redirects]]
  from = "/lib/three.min.js"
  to = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
  status = 200
  force = false

[[redirects]]
  from = "/lib/chart.umd.js"
  to = "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"
  status = 200
  force = false

[[redirects]]
  from = "/lib/qrcode.min.js"
  to = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Always fetch the latest page so a redeploy shows up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Pinned library versions never change, so they can be cached for a long time.
[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
